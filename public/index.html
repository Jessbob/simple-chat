<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Direct Messenger</title>
    <style>
        body { font-family: Arial, sans-serif; display: flex; flex-direction: column; align-items: center; background-color: #f4f4f9; padding: 20px; }
        .container { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 100%; max-width: 700px; }
        #chat-interface { display: none; }
        .flex-row { display: flex; gap: 20px; }
        #user-panel { width: 35%; border-right: 1px solid #ddd; padding-right: 10px; }
        #chat-panel { width: 65%; }
        #messages { height: 300px; border: 1px solid #ddd; overflow-y: scroll; padding: 10px; margin-bottom: 10px; background: #fafafa; }
        .msg { margin-bottom: 8px; padding: 5px; border-radius: 4px; }
        .sender { font-weight: bold; color: #0056b3; }
        .time { font-size: 0.75em; color: #888; margin-right: 5px; }
        select, input[type="text"], button { padding: 10px; margin-top: 5px; box-sizing: border-box; }
        select { width: 100%; height: 200px; }
        input[type="text"] { border: 1px solid #ccc; border-radius: 4px; }
        #msg-input { width: 75%; }
        button { background: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #218838; }
        .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 2px solid #eee; padding-bottom: 10px;}
        .logout-btn { background: #dc3545; padding: 5px 10px; }
        .add-contact-row { display: flex; gap: 5px; margin-bottom: 10px; }
        #new-contact { width: 100%; }
    </style>
</head>
<body>

    <div class="container" id="login-interface">
        <h2>Welcome to Messenger</h2>
        <input type="text" id="username" placeholder="Enter your display name">
        <button onclick="joinChat()">Join</button>
    </div>

    <div class="container" id="chat-interface">
        <div class="header-bar">
            <h3 style="margin: 0;">Chatting as: <span id="my-name-display" style="color: #0056b3;"></span></h3>
            <button class="logout-btn" onclick="changeName()">Change Name</button>
        </div>
        <div class="flex-row">
            <div id="user-panel">
                <h3 style="margin-top: 0;">Conversations</h3>
                
                <!-- NEW: Add any user manually -->
                <div class="add-contact-row">
                    <input type="text" id="new-contact" placeholder="Enter a username...">
                    <button onclick="addContact()">Add</button>
                </div>
                
                <select id="recipient-select" size="10" onchange="loadConversation()"></select>
            </div>
            <div id="chat-panel">
                <h3 style="margin-top: 0;">Messages</h3>
                <div id="messages"></div>
                <div style="display: flex; gap: 5px;">
                    <input type="text" id="msg-input" placeholder="Type a message..." onkeypress="checkEnter(event)">
                    <button onclick="sendMessage()">Send</button>
                </div>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="app.js"></script>
</body>
</html>
