<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Stealth Title and Logo -->
    <title>Google Classroom</title>
    <link rel="icon" type="image/png" href="https://ssl.gstatic.com/classroom/favicon.png">
    
    <style>
        body { font-family: Arial, sans-serif; display: flex; flex-direction: column; align-items: center; background-color: #f4f4f9; padding: 20px; }
        .container { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 100%; max-width: 750px; }
        
        .auth-box { text-align: center; margin-bottom: 10px; }
        .auth-box input { display: block; width: 80%; margin: 10px auto; padding: 10px; }
        .auth-box button { width: 80%; padding: 10px; background: #0056b3; color: white; border: none; border-radius: 4px; cursor: pointer; }
        .toggle-link { color: #0056b3; cursor: pointer; text-decoration: underline; font-size: 0.9em; }

        #chat-interface { display: none; }
        .flex-row { display: flex; gap: 20px; height: 450px; }
        #user-panel { width: 35%; border-right: 1px solid #ddd; padding-right: 10px; display: flex; flex-direction: column; }
        #chat-panel { width: 65%; display: flex; flex-direction: column; }
        
        #contact-list { flex-grow: 1; border: 1px solid #ccc; overflow-y: scroll; border-radius: 4px; background: white; }
        .contact-item { padding: 10px; border-bottom: 1px solid #eee; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
        .contact-item:hover { background: #f0f0f0; }
        .contact-item.active { background: #e6f7ff; border-left: 4px solid #0056b3; }
        
        .contact-info { display: flex; flex-direction: column; }
        .contact-name { font-weight: bold; }
        .status-text { font-size: 0.75em; color: gray; }
        .status-text.online { color: #28a745; font-weight: bold; }
        
        .dot { color: #28a745; display: none; font-size: 1.2em; }
        .contact-item.unread .dot { display: block; }

        #messages { flex-grow: 1; border: 1px solid #ddd; overflow-y: scroll; padding: 10px; margin-bottom: 10px; background: #fafafa; }
        .msg { margin-bottom: 8px; padding: 5px; border-radius: 4px; }
        .sender { font-weight: bold; color: #0056b3; }
        .time { font-size: 0.75em; color: #888; margin-right: 5px; }
        
        input[type="text"], input[type="password"] { border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { background: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; padding: 10px;}
        .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 2px solid #eee; padding-bottom: 10px;}
        .search-row { display: flex; gap: 5px; margin-bottom: 10px; }
        #search-input { width: 100%; padding: 10px; }
    </style>
</head>
<body>

    <div class="container" id="auth-interface">
        <h2 style="text-align: center;">Welcome to Class</h2>
        
        <div id="login-section" class="auth-box">
            <h3>Login</h3>
            <input type="text" id="log-user" placeholder="Username">
            <input type="password" id="log-pass" placeholder="Password">
            <button onclick="attemptLogin()">Login</button>
            <p>Need an account? <span class="toggle-link" onclick="toggleAuth()">Sign up here</span></p>
        </div>

        <div id="signup-section" class="auth-box" style="display: none;">
            <h3>Create Account</h3>
            <input type="text" id="sign-user" placeholder="New Username">
            <input type="password" id="sign-pass" placeholder="New Password">
            <button onclick="attemptSignup()">Sign Up</button>
            <p>Already have an account? <span class="toggle-link" onclick="toggleAuth()">Login here</span></p>
        </div>
    </div>

    <div class="container" id="chat-interface">
        <div class="header-bar">
            <h3 style="margin: 0;">User: <span id="my-name-display" style="color: #0056b3;"></span></h3>
            <button style="background: #dc3545;" onclick="logout()">Log Out</button>
        </div>
        <div class="flex-row">
            <div id="user-panel">
                <div class="search-row">
                    <input type="text" id="search-input" placeholder="Add user...">
                    <button onclick="searchForUser()">Add</button>
                </div>
                <div id="contact-list"></div>
            </div>
            <div id="chat-panel">
                <h3 style="margin-top: 0; margin-bottom: 10px;" id="chat-header">Select a conversation</h3>
                
                <div id="messages"></div>
                <div id="typing-indicator" style="font-size: 0.85em; color: #888; height: 15px; margin-bottom: 5px; font-style: italic;"></div>
                
                <div style="display: flex; gap: 5px;">
                    <input type="text" id="msg-input" placeholder="Type a message..." style="width: 100%; padding: 10px;" onkeypress="checkEnter(event)">
                    <button onclick="sendMessage()">Send</button>
                </div>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="app.js"></script>
</body>
</html>
